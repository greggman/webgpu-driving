<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebGPU Driving</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #screen { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; left: 12px; bottom: 12px; color: #fff; font: 12px/1.4 system-ui, sans-serif;
      text-shadow: 0 1px 2px #000; opacity: 0.85; pointer-events: none; white-space: pre;
    }
    #hud.hidden { display: none; }
    #error {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      color: #fff; font: 16px system-ui, sans-serif; text-align: center; padding: 24px;
    }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="hud"></div>
  <div id="error"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
